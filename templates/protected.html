<!DOCTYPE html>
<!--
    protected.html
    - Simple protected area shown only when a user is in the session.
    - `app.py` passes a `user` variable (session username) when rendering this
        template. We display it here to personalize the page.
    - The logout link points at the `logout` route which clears the session.
-->
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Document title shown in the browser tab -->
        <title>Protected Page</title>

        <!-- Site stylesheet is included via Flask's `url_for` helper -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="index-body">
        <!--
            Container element: could be used for responsive layout. The inner
            `.content-box` contains the visual card for the protected content.
        -->
        <div class="container">
                <div class="content-box">
                        <h2>Protected Content</h2>
                        <p>Welcome, {{ user }}! You have successfully logged in.</p>
                        
                        <div id="chat">
                                <div id="messages"></div>
                                <div id="chat_input_area">
                                        <input id="message_input" placeholder="Type a message...">
                                        <button onclick="sendMessage()">Send</button>
                                </div>
                        </div>

                        <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
                </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
        <script>
                const socket = io();

                socket.on("connect", () => {
                        console.log("Connected to server");
                });

                socket.on("disconnect", () => {
                        console.log("Disconnected from server");
                });

                socket.on("message", (msg) => {
                        const messagesDiv = document.getElementById("messages");
                        const messageElement = document.createElement("div");
                        messageElement.innerHTML = msg;
                        messagesDiv.appendChild(messageElement);
                });

                function sendMessage() {
                        const input = document.getElementById("message_input");
                        const message = input.value;
                        if (message) {
                                socket.send(message);
                                input.value = "";
                        }
                }
        </script>
</body>
</html>
