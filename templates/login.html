<!DOCTYPE html>
<!--
    login.html
    - Renders the login form and shows an optional error message.
    - The form posts back to the same `/login` route handled by `app.py`.
-->
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- The browser tab title -->
        <title>Login</title>

        <!-- Include site stylesheet via Flask's `url_for('static', ...)` helper -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
        {% if error %}
                <div class="error-container">
                        <p class="error">{{ error }}</p>
                </div>
        {% endif %}
        
        <form method="POST" class="login-wrapper">
                <h2>Login</h2>

                <!-- Username input: short, descriptive label and proper `id`/`name`. -->
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>

                <!-- Password input: use `type="password"` so browsers hide the value. -->
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>

                <!-- Submit button: visually prominent via CSS. -->
                <button type="submit">Login</button>

                <p>Don't have an account? <a href="/register">Register here</a></p>
        </form>
</body>
</html>
